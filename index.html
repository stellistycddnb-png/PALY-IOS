<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">

<title>КОЛ-ЦЕНТР: СМЕНА — БОЛЬШАЯ ПЕРЕМЕНА · build 1.4.0 — MADE BY PESSIMIST</title>
<style>:root{--bg:#0e0a1c;--pn:rgba(24,16,48,.94);--bd:#4a3a82;--ac:#ffd23a;--pk:#ff3ac8;--mt:#5dffc0;--tx:#f2ecff;--mu:#9a8fb8;--bad:#ff5a6a;--st:0px;--sb:0px;--sl:0px;--sr:0px}
html.cap{--st:24px;--sb:12px;--sl:6px;--sr:6px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--tx);font:15px/1.35 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.hide{display:none!important}
button{font:inherit;color:var(--tx);cursor:pointer}
a{color:#7fd0ff}
canvas#tcv{position:fixed;inset:0;width:100%;height:100%}
#title{position:fixed;inset:0;z-index:20}
#tbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 20px);width:min(380px,90vw);display:flex;flex-direction:column;gap:8px}
#tgl{position:absolute;left:0;right:0;top:calc(var(--st) + 8px);text-align:center;font-size:12px;color:#cdbfff}
#tgl a{font-weight:700;margin:0 6px}
.btn{background:linear-gradient(#3a2a6e,#241848);border:1.5px solid var(--bd);border-radius:12px;padding:11px 14px;font-weight:700;box-shadow:0 2px 0 #0008}
.btn:active{transform:translateY(1px);filter:brightness(1.25)}
.btn.pri{background:linear-gradient(#ffd23a,#e89a00);border-color:#fff1a8;color:#201400}
.btn.warn{background:linear-gradient(#ff5a8a,#c01860);border-color:#ffb0d0}
.btn.dng{border-color:#c44}.btn.sm{padding:6px 10px;font-size:13px}.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.two>*{flex:1}.col{display:flex;flex-direction:column;gap:8px}
/* интро */
#intro{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .6s;padding:20px}
#intro .by{letter-spacing:.5em;font-size:14px;color:#9a8a70;opacity:0;animation:fi 1s .2s forwards}
#intro .pes{font:900 52px Impact,"Arial Black",sans-serif;letter-spacing:.1em;color:#eee;margin:10px 0;position:relative;opacity:0;animation:fi .8s .5s forwards,glt 2.6s 1s infinite;text-shadow:0 0 22px rgba(255,58,200,.8)}
#intro .pes:before,#intro .pes:after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.7}
#intro .pes:before{color:#ff3a3a;transform:translate(-3px,0);clip-path:inset(0 0 55% 0);animation:g1 2.6s 1s infinite}
#intro .pes:after{color:#2ae8ff;transform:translate(3px,0);clip-path:inset(55% 0 0 0);animation:g2 2.6s 1s infinite}
#intro .ln{opacity:0;animation:fi 1s 1.4s forwards;font-size:15px;margin-top:6px}
#intro .tap{position:absolute;bottom:20px;color:#6a5c78;font-size:12px}
@keyframes fi{to{opacity:1}}
@keyframes glt{0%,86%,100%{transform:none}88%{transform:skewX(8deg)}90%{transform:skewX(-6deg) translateX(4px)}92%{transform:none}}
@keyframes g1{0%,86%,100%{transform:translate(-3px,0)}89%{transform:translate(-9px,2px)}}
@keyframes g2{0%,86%,100%{transform:translate(3px,0)}89%{transform:translate(9px,-2px)}}
/* игра */
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:calc(var(--st) + 4px) calc(var(--sr) + 6px) calc(var(--sb) + 6px) calc(var(--sl) + 6px);gap:6px}
#hud{background:var(--pn);border:1.5px solid var(--bd);border-radius:12px;padding:6px 8px}
.h1{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
#hMoney{color:var(--mt)}#hTime{color:var(--ac)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:5px}
.bars div.bw{display:flex;align-items:center;gap:6px;font-size:12px}.bars b{width:20px;text-align:center}
.bar{flex:1;height:8px;background:#1a1236;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;width:50%;transition:width .3s}
.bar.grn i{background:#5dffc0}.bar.yel i{background:#ffd23a}.bar.red i{background:#ff5a6a}
#plan{font-size:12px;color:var(--mu);margin-top:5px}#planB{margin-top:3px}
#main>*{flex:none}
#scene{width:100%;height:36vh;min-height:220px;flex:none;border-radius:12px;border:1.5px solid var(--bd);display:block;background:#222}
#main{flex:1;background:var(--pn);border:1.5px solid var(--bd);border-radius:12px;padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
.idle{margin:auto;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;color:#cfc4ee}.idle .big{font-size:44px}
.btn.huge{font-size:20px;padding:18px 26px}
.pulse{animation:pl .7s infinite}@keyframes pl{50%{transform:scale(1.06)}}
.caller{display:flex;gap:10px;align-items:center}.av{font-size:38px;width:62px;height:62px;border-radius:50%;background:#2c1f58;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.av.big{width:86px;height:86px;font-size:52px;margin:0 auto 6px}
.bio{font-size:12.5px;color:#cfc4ee}
.lg{display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:78px}.lg div{padding:5px 9px;border-radius:10px;max-width:90%}
.lg .me{background:#3a2a6e;align-self:flex-end}.lg .them{background:#1f2a48;align-self:flex-start}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:10px}.meters small{color:var(--mu);font-size:11px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.opt{background:linear-gradient(#34266a,#221846);border:1.5px solid var(--bd);border-radius:12px;padding:6px 6px;font-weight:700;display:flex;gap:6px;align-items:center;justify-content:center}.opt i{font-style:normal;font-size:20px}.opt:active{filter:brightness(1.3)}
#bar{display:grid;grid-template-columns:repeat(20,1fr);gap:5px}#bar button{grid-column:span 4}#bar button.r2{grid-column:span 5}#bar.off{opacity:.35;pointer-events:none}
#bar button{padding:5px 1px;background:var(--pn);border:1.5px solid var(--bd);border-radius:12px;font-size:11px;font-weight:700}#bar button i{display:block;font-style:normal;font-size:17px}
/* окна */
.scr{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:calc(var(--st) + 10px) calc(var(--sr) + 12px) calc(var(--sb) + 10px) calc(var(--sl) + 12px)}
.scr.dim{background:rgba(6,3,16,.8);backdrop-filter:blur(3px)}
.box{background:var(--pn);border:2px solid var(--bd);border-radius:16px;padding:14px 16px;max-height:100%;overflow:auto;width:100%;max-width:440px;box-shadow:0 10px 40px #000a}
.box h2{margin:0 0 8px;color:var(--ac);font:800 22px Georgia,serif}.box h3{margin:12px 0 4px;color:var(--pk);font-size:15px}.box p{color:#ddd3f5;font-size:13.5px;margin:.4em 0}
.sad{color:#ffb0c0!important;font-style:italic}.help{color:#9ff0d0!important;border:1px dashed #3a8a6a;border-radius:10px;padding:8px}
.stat{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13.5px;margin:8px 0}.win{color:#5dffc0}.lose{color:#ff5a6a}
.big.bad{color:#ff5a6a}.big.good{color:#5dffc0}.big.meh{color:#ffd23a}.box .big{font:900 34px Impact,"Arial Black",sans-serif;letter-spacing:.06em}
.tech{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#1a1236;border:1.5px solid #33286a;border-radius:10px;padding:6px 9px;margin:4px 0}.tech small{color:var(--mu)}
.sl{display:flex;gap:8px;align-items:center;margin:8px 0}.sl input{flex:1;accent-color:#ffd23a}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(var(--st) + 120px);z-index:40;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;width:92vw}
.toast{background:rgba(10,6,24,.94);border:1.5px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:13px;animation:tin .25s,tout .5s 2.2s forwards;text-align:center}.toast.bad{border-color:var(--bad)}.toast.ok{border-color:#3c9a6a}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}@keyframes tout{to{opacity:0}}
.btn small{font-weight:400;opacity:.85}
.opt.wide{grid-column:1/3}.opt:disabled{opacity:.35}.dil{background:#2a1840;border:1.5px solid var(--pk);border-radius:12px;padding:8px 10px}.dil p{margin:4px 0 8px;font-size:13px}
.fl{position:fixed;left:50%;top:calc(var(--st) + 60px);transform:translateX(-50%);z-index:45;font:900 28px Impact,"Arial Black",sans-serif;pointer-events:none;animation:flo 1.4s ease-out forwards;text-shadow:0 2px 0 #000,0 0 14px currentColor}.fl.g{color:#5dffc0}.fl.r{color:#ff5a6a}
@keyframes flo{from{opacity:0;transform:translate(-50%,10px) scale(.7)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}to{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.shake{animation:shk .45s}@keyframes shk{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.av.talk{animation:tk 1.1s infinite}@keyframes tk{50%{transform:scale(1.07);box-shadow:0 0 14px #ff3ac8aa}}
#intro .ver{color:#ff7adf;letter-spacing:.2em;font-size:13px}
.scr .box{animation:pop .22s}@keyframes pop{from{opacity:0;transform:scale(.94) translateY(8px)}}
.btn{transition:filter .15s,transform .1s}

#tlogo{position:absolute;left:0;right:0;top:calc(var(--st) + 7vh);text-align:center;pointer-events:none}
#tlogo .tpill{display:inline-block;border:1.5px solid #ff7adf;color:#ff7adf;border-radius:20px;padding:3px 14px;font-weight:800;letter-spacing:.12em;font-size:12px;background:rgba(255,58,200,.12)}
#tlogo .t1{font:900 clamp(40px,12vw,58px) Impact,"Arial Black",sans-serif;letter-spacing:.04em;margin-top:12px;background:linear-gradient(#fff3a8,#ffb400);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,58,200,.7));animation:tfl 3s infinite}
#tlogo .t2{font:900 clamp(34px,10vw,48px) Impact,"Arial Black",sans-serif;letter-spacing:.3em;margin-top:-4px;color:#5dffc0;text-shadow:0 0 18px #2ae8ff,0 3px 0 #0a2a22}
#tlogo .tupd{margin:16px auto 0;display:inline-block;padding:7px 18px;font-weight:900;letter-spacing:.14em;font-size:13px;color:#201400;background:linear-gradient(90deg,#ffd23a,#ff7adf,#ffd23a);background-size:200% 100%;border-radius:8px;animation:tsh 3s linear infinite;box-shadow:0 0 22px rgba(255,210,58,.5)}
#tlogo .tby{margin-top:12px;font-size:11px;letter-spacing:.4em;color:#b8a8d8}
@keyframes tfl{0%,92%,100%{opacity:1}94%{opacity:.6}96%{opacity:1}98%{opacity:.7}}
@keyframes tsh{to{background-position:200% 0}}
#tbtn .btn.big{font-size:19px;padding:15px}
#tbtn .btn.dev{background:rgba(24,16,48,.7);border-style:dashed;font-size:13px;padding:8px}
#tbtn{gap:7px}

.talk{display:flex;flex-direction:column;gap:6px}.reply{display:block;width:100%;text-align:left;font-weight:600;font-size:14px;line-height:1.3;padding:10px 12px;border-radius:12px;border:1.5px solid var(--bd);background:linear-gradient(180deg,#34286a,#241a4c);color:var(--tx)}.reply:active{transform:scale(.985)}.reply small{display:block;color:var(--mu);font-weight:500;margin-top:2px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{flex:1 1 auto;padding:7px 10px;border-radius:10px;border:1.5px solid var(--bd);background:var(--pn);color:var(--tx);font-size:12px;font-weight:700}

/* ===== дизайн 1.3.2: стекло, свечение, аккуратные детали ===== */
:root{--pn:rgba(26,18,54,.92);--bd:#4b3b8c;--glow:0 0 0 1px rgba(255,255,255,.04) inset,0 6px 22px rgba(0,0,0,.45)}
html,body{background:radial-gradient(120% 70% at 50% -10%,#2a1a5c 0%,#150e2e 45%,#0b0718 100%) fixed}
#app{background:transparent}
#hud{background:linear-gradient(180deg,rgba(40,28,84,.95),rgba(24,16,52,.95));border:1.5px solid var(--bd);box-shadow:var(--glow);border-radius:14px}
.h1{letter-spacing:.01em}
#hMoney{text-shadow:0 0 10px rgba(93,255,192,.45)}#hTime{text-shadow:0 0 10px rgba(255,210,58,.4)}
.bar{height:9px;background:#120c2a;box-shadow:0 1px 3px #000a inset;border-radius:6px}
.bar i{border-radius:6px;box-shadow:0 0 8px currentColor;background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%)}
.bar.grn i{background-color:#34e8a8;color:#34e8a8}.bar.yel i{background-color:#ffc928;color:#ffc928}.bar.red i{background-color:#ff4a62;color:#ff4a62}
#main,.box{background:linear-gradient(180deg,rgba(34,24,70,.94),rgba(22,15,48,.96));border-color:var(--bd);box-shadow:var(--glow)}
#main{border-radius:14px}
#scene{border-radius:14px;box-shadow:var(--glow)}
.box{border-radius:18px;position:relative}
.box:before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#ff3ac8,#ffd23a,transparent);opacity:.9}
.box h2{text-shadow:0 2px 12px rgba(255,210,58,.35);letter-spacing:.01em}
.box h3{display:flex;align-items:center;gap:6px;font-size:14px;letter-spacing:.02em;text-transform:none}
.box h3:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(255,58,200,.5),transparent)}
.btn{background:linear-gradient(180deg,#43338a,#291d58);border:1.5px solid #5c4aa6;box-shadow:0 3px 0 #0a0620,0 6px 14px rgba(0,0,0,.35),0 1px 0 rgba(255,255,255,.12) inset;border-radius:13px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a0620,0 2px 6px rgba(0,0,0,.4)}
.btn.pri{background:linear-gradient(180deg,#ffe06a,#f0a000);border-color:#fff2b0;color:#2a1a00;box-shadow:0 3px 0 #8a5a00,0 6px 16px rgba(255,190,40,.28),0 1px 0 rgba(255,255,255,.5) inset}
.btn.warn{box-shadow:0 3px 0 #70104a,0 6px 16px rgba(255,60,140,.25),0 1px 0 rgba(255,255,255,.25) inset}
.btn:disabled{filter:grayscale(.5)}
.tech{background:linear-gradient(180deg,#201848,#171038);border:1.5px solid #3a2e78;border-radius:12px;padding:8px 10px}
.stat{gap:5px 12px}.stat>*:nth-child(odd){color:#b9aedb}.stat>*:nth-child(even){font-variant-numeric:tabular-nums}
.stat span{padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
.help{background:rgba(52,200,140,.07)}
.lg{gap:6px;font-size:13.5px}.lg div{padding:7px 11px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.lg .me{background:linear-gradient(180deg,#4a38a0,#37287c);border-radius:14px 14px 4px 14px}
.lg .them{background:linear-gradient(180deg,#26345c,#1c2848);border-radius:14px 14px 14px 4px}
.meters{gap:12px}.meters small{display:flex;justify-content:space-between;gap:4px;font-size:11.5px;margin-bottom:3px;color:#b0a5d0}.meters small em{font-style:normal;color:#ffd23a;opacity:.9}
.caller .av{box-shadow:0 0 0 3px rgba(255,58,200,.15),0 4px 12px rgba(0,0,0,.4);background:radial-gradient(circle at 30% 30%,#4a3890,#241a52)}
.reply{background:linear-gradient(180deg,#3a2d78,#271c58);box-shadow:0 2px 0 #0a0620,0 1px 0 rgba(255,255,255,.1) inset;border-color:#5c4aa6}
.reply:active{transform:translateY(1px);filter:brightness(1.2)}
.chip{box-shadow:0 1px 0 rgba(255,255,255,.1) inset}
#bar{gap:6px}
#bar button{background:linear-gradient(180deg,rgba(46,34,96,.95),rgba(26,18,56,.95));border-color:#4b3b8c;border-radius:14px;padding:6px 1px 5px;box-shadow:0 3px 0 #0a0620;font-size:10.5px;color:#d8ceff;line-height:1.1}
#bar button i{font-size:20px;margin-bottom:2px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}

.toast{background:rgba(16,10,38,.96);backdrop-filter:blur(6px);box-shadow:0 6px 18px rgba(0,0,0,.45);font-size:12.5px;padding:5px 11px;border-radius:12px}
#toasts{top:calc(var(--st) + 6px);gap:3px}
.scr.dim{background:radial-gradient(90% 60% at 50% 40%,rgba(30,14,60,.8),rgba(4,2,12,.9));backdrop-filter:blur(4px)}
.idle{color:#d6ccf5}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#4b3b8c;border-radius:5px}::-webkit-scrollbar-track{background:transparent}
.dil{background:linear-gradient(180deg,#34184a,#24103a);box-shadow:0 0 14px rgba(255,58,200,.18)}
.opt{box-shadow:0 3px 0 #0a0620,0 1px 0 rgba(255,255,255,.1) inset}
@media (prefers-reduced-motion:reduce){.pulse,.av.talk{animation:none}}
.opts>.btn.pri{grid-column:1/3}.opts>.btn:last-child:nth-child(odd){grid-column:1/3}

/* ===== ИНТРО 1.3.2 ===== */
#intro{background:#030208;overflow:hidden;justify-content:center}
#intro .i-glow{position:absolute;left:50%;top:46%;width:130vmax;height:130vmax;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,58,200,.22) 0%,rgba(90,30,160,.12) 30%,transparent 60%);opacity:0;animation:ig 1.6s 2s forwards,ibr 4s 3.6s ease-in-out infinite}
@keyframes ig{to{opacity:1}}@keyframes ibr{50%{opacity:.55}}
#intro .i-term{position:absolute;left:7vw;right:7vw;top:50%;transform:translateY(-50%);font:13px/1.8 "SF Mono",Menlo,Consolas,monospace;color:#5dffc0;text-align:left;white-space:pre-wrap;text-shadow:0 0 8px rgba(93,255,192,.6);animation:itf .35s 2s forwards}
#intro .i-term:after{content:"█";animation:blk .6s steps(1) infinite;margin-left:2px}
@keyframes itf{to{opacity:0;visibility:hidden}}@keyframes blk{50%{opacity:0}}
#intro .i-main{position:relative;opacity:0;animation:fi .3s 2s forwards;display:flex;flex-direction:column;align-items:center;gap:0}
#intro .i-by{letter-spacing:.7em;font-size:12px;color:#b8a8d8;margin-right:-.7em;opacity:0;animation:fi 1s 2.7s forwards}
#intro .i-neon{position:relative;font:900 clamp(40px,14.5vw,76px) Impact,"Arial Black",sans-serif;letter-spacing:.07em;color:#ffe6fb;margin:10px 0 4px;text-shadow:0 0 4px #fff,0 0 14px #ff3ac8,0 0 34px #ff3ac8,0 0 70px #c0189a;opacity:0;animation:nz 1.5s 2.1s forwards,nflk 5s 4s infinite}
@keyframes nz{0%{opacity:0}8%{opacity:1}12%{opacity:.1}20%{opacity:1}26%{opacity:.2}34%{opacity:.9}40%{opacity:.3}55%,100%{opacity:1}}
@keyframes nflk{0%,90%,100%{opacity:1}92%{opacity:.55}94%{opacity:1}96%{opacity:.7}}
#intro .i-neon:before,#intro .i-neon:after{content:attr(data-t);position:absolute;left:0;right:0;top:0;text-shadow:none;opacity:0}
#intro .i-neon:before{color:#2ae8ff;clip-path:inset(0 0 55% 0);animation:g1 4.5s 3.6s infinite}
#intro .i-neon:after{color:#ff3a3a;clip-path:inset(55% 0 0 0);animation:g2 4.5s 3.6s infinite}
#intro .i-bar{height:3px;width:0;border-radius:3px;background:linear-gradient(90deg,transparent,#ffd23a,#ff3ac8,#5dffc0,transparent);box-shadow:0 0 14px rgba(255,210,58,.6);animation:ibw 1s 3s forwards}
@keyframes ibw{to{width:min(78vw,420px)}}
#intro .i-links{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px;opacity:0;animation:fi 1s 3.4s forwards}
#intro .i-links a{color:#e6dcff;text-decoration:none;font-weight:700;font-size:13px;padding:7px 13px;border-radius:20px;border:1.5px solid rgba(255,255,255,.25);background:rgba(255,255,255,.07);backdrop-filter:blur(6px)}
#intro .i-game{margin-top:26px;font:900 15px Impact,"Arial Black",sans-serif;letter-spacing:.22em;color:#ffd23a;text-shadow:0 0 14px rgba(255,210,58,.5);opacity:0;animation:fi 1s 4.1s forwards;display:flex;flex-direction:column;align-items:center;gap:4px}
#intro .i-game small{font:600 11px sans-serif;letter-spacing:.2em;color:#ff7adf}
#intro .i-scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0,rgba(255,255,255,.035) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay;animation:isc 8s linear infinite}
@keyframes isc{to{background-position:0 60px}}

  function amb() {if (!ac || !on || sv <= 0 || ac.currentTime < ambT) return; ambT = ac.currentTime + 1.2 + Math.random() * 2.5; const t = ac.currentTime; noise(t, .5 + Math.random() * .6, .035, sG, 'bandpass', 350 + Math.random() * 400, 250); if (Math.random() < .12) {osc(t + .1, 1300, .08, 'square', .02, sG); osc(t + .3, 1300, .08, 'square', .02, sG);} if (Math.random() < .35) noise(t + .2, .03, .05, sG, 'highpass', 4000); if (Math.random() < .08) for (let i = 0; i < 8; i++) noise(t + i * .07, .05, .035, sG, 'bandpass', 900, 500); if (Math.random() < .07) osc(t, 1800, .08, 'sine', .035, sG, 2600); if (Math.random() < .06) noise(t, .12, .06, sG, 'lowpass', 500, 120);}

    if (!ac || !on || ac.state !== 'running' || mv <= 0) return; const sd = 60 / 78 / 4;

    const mel = [0, -1, 7, -1, 5, -1, 3, -1, 0, -1, 3, -1, 7, -1, 10, -1], k = mel[(st + bar * 4) % 16]; if (k >= 0 && bar % 2 === 1) osc(t, hz(root + 24 + k), .5, 'sine', .06, o);
  }
  return {init, resume, setVol, sfx, ringStart, ringStop, setMood};
})();

function scrHelp(from) {showScr('<div class="box" data-from="' + from + '"><h2>❔ Как играть</h2><p>Вы — новичок-оператор в вымышленной конторе <b>' + COMPANY + '</b>. Игра — чёрная комедия про то, как устроен такой «бизнес» и сколько он стоит живым людям.</p><h3>Смена</h3><p>• Принимайте звонки и ведите разговор. Выбирайте манеру: <b>давление, лесть, термины, сочувствие</b>. Каждому человеку подходит своя.<br>• Полоска «убеждённость» растёт — «успех». Полоска «подозрение» растёт — человек бросит трубку.<br>• Кофе, обед, перекур помогают с усталостью.<br>• В конце дня — итоги, зарплата, аренда и магазин улучшений.</p><h3>Показатели</h3><p>🧠 <b>Совесть</b> — упадёт до нуля, и вы уже не человек. 🚨 <b>Риск</b> — дойдёт до 100: обыск. 😠 <b>Босс</b> — упадёт до нуля: увольнение. ⚡ <b>Энергия</b> — влияет на убедительность.</p><h3>Выбор</h3><p>В любой момент можно <b>предупредить человека</b> и сорвать «сделку». Это снижает прибыль, но возвращает совесть и даёт материалы для киберполиции. Собрав их достаточно, можно «сдать» контору.</p><p style="color:#9a8fb8">Игра сатирическая. Все «схемы» вымышленные и нарочито абсурдные.</p><div class="row"><button class="btn pri" data-a="back">' + (from === 'first' ? '▶ Играть' : '← Назад') + '</button></div></div>', from !== 'title');}
function scrAbout(from) {showScr('<div class="box" data-from="' + from + '"><h2>ℹ КОЛ-ЦЕНТР: СМЕНА</h2><p style="color:#ff7adf;font-weight:800">' + VERSION + '</p><p>Сатирическая симуляция смены в мошенническом кол-центре. Игра не учит обманывать: она показывает цену. Все названия, компания и «схемы» вымышлены.</p><h3>MADE BY PESSIMIST</h3><div class="row">' + TGB + '</div><p style="margin-top:10px">Telegram автора: <b>' + TG_USER + '</b><br>Канал: ' + TG_CHANNEL + '</p><p style="color:#c9bfe6">' + HELP_TEXT + '</p><div class="row"><button class="btn" data-a="back">← Назад</button></div></div>', from !== 'title');}
function scrPrivacy(from) {showScr('<div class="box priv" data-from="' + from + '"><h2>🔒 Политика конфиденциальности</h2><p style="color:#9a8fb8">Вступает в силу: 20 ноября 2026 г.</p><p>Эта политика описывает, как игра «Кол-центр: Смена» (разработчик — PESSIMIST, Telegram: @Izzolentaaa) обращается с данными.</p><h3>1. Какие данные мы собираем</h3><p>Никакие. Игра не требует регистрации и не запрашивает доступ к контактам, камере, микрофону, геолокации, файлам и другим данным устройства. В игре нет рекламы, аналитики, встроенных покупок и сторонних SDK. Игра не отправляет данные на серверы и не требует интернета.</p><h3>2. Данные на устройстве</h3><p>Сохранение прогресса и настройки (громкость) хранятся только локально в памяти приложения и удаляются при удалении приложения или очистке его данных. Если на устройстве включено резервное копирование Android, система может включить данные приложения в резервную копию вашего аккаунта Google — это определяется настройками устройства и политикой Google.</p><h3>3. Ссылки на сторонние сервисы</h3><p>В игре есть ссылки на Telegram (канал разработчика и профиль автора). На эти сервисы распространяется их собственная политика конфиденциальности.</p><h3>4. Дети</h3><p>Мы не собираем персональные данные ни от кого, включая детей. Игра содержит тёмный юмор на взрослую тему (мошенничество), рекомендуется для 16+.</p><h3>5. Изменения</h3><p>Политика может обновляться вместе с новыми версиями игры. Актуальный текст всегда доступен в игре.</p><h3>6. Контакты</h3><p>Telegram: ' + TG_USER + '.</p><div class="row">' + TGB + '</div><div class="row" style="margin-top:8px"><button class="btn" data-a="back">← Назад</button></div></div>', from !== 'title');}
